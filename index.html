<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia XpressMusic Simulator</title>
    <style>
        /* --- CSS Reset & Layout --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #4a0000; /* พื้นหลังสีแดงเข้ม */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Phone Body --- */
        .phone {
            width: 320px;
            background-color: #1a1a1a;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.8);
            border: 3px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Red Side Panels --- */
        .side-panel {
            position: absolute;
            top: 60px;
            bottom: 120px;
            width: 20px;
            background-color: #c00;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.3);
        }
        .side-panel.left { left: -2px; }
        .side-panel.right { right: -2px; }

        .side-btn {
            width: 100%;
            height: 30px;
            background-color: #e60000;
            border: 1px solid #a00;
            border-radius: 3px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
        .side-btn:active { background-color: #ff3333; }

        /* --- Top Section (Screen Area) --- */
        .top-section {
            width: 100%;
            background-color: #222;
            border-radius: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 10px;
            padding: 0 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* --- Screen --- */
        .screen {
            width: 100%;
            height: 200px;
            background-color: #000;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #444;
        }

        /* Screen Content Mockup */
        .screen-content {
            flex: 1;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
            text-align: center;
            font-size: 14px;
            padding: 10px;
            position: relative;
        }

        .screen-content img {
            max-width: 80%;
            max-height: 80%;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* LED Feedback Text */
        .led-feedback {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-size: 12px;
            padding: 5px;
            text-align: center;
            font-family: monospace;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .led-feedback.active {
            opacity: 1;
        }

        /* --- Middle Section (Navigation Keys) --- */
        .middle-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            background-color: #222;
            border-radius: 0 0 20px 20px;
            margin-bottom: 10px;
            position: relative;
        }

        /* D-Pad */
        .d-pad {
            width: 80px;
            height: 80px;
            background-color: #111;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 10px #000, 0 2px 5px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }
        .d-pad-center {
            width: 30px;
            height: 30px;
            background-color: #333;
            border-radius: 50%;
            border: 2px solid #555;
            cursor: pointer;
            z-index: 2;
        }
        .d-pad-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            width: 25px;
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .d-pad-up { top: 5px; left: 27px; }
        .d-pad-down { bottom: 5px; left: 27px; }
        .d-pad-left { left: 5px; top: 27px; }
        .d-pad-right { right: 5px; top: 27px; }

        /* Call Buttons */
        .call-buttons {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none; /* Let clicks pass through to buttons */
        }
        .call-btn {
            width: 35px;
            height: 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
        .call-btn.green { background-color: #0a0; }
        .call-btn.red { background-color: #a00; }
        .call-btn:active { transform: scale(0.95); }

        /* --- Keypad --- */
        .keypad {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 5px;
            background-color: #222;
            border-radius: 15px;
        }

        .key {
            background-color: #333;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #111, 0 4px 5px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            user-select: none;
            font-size: 16px;
            font-weight: bold;
        }
        .key:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #111, 0 1px 2px rgba(0,0,0,0.5);
            background-color: #444;
        }
        
        .key-sub {
            font-size: 8px;
            color: #888;
            font-weight: normal;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Specific Key Colors */
        .key-green { color: #0f0; }
        .key-red { color: #f00; }
        
        /* Bottom row keys (special) */
        .key-special {
            background-color: #222;
            border: 1px solid #333;
            box-shadow: 0 3px 0 #000, 0 4px 5px rgba(0,0,0,0.5);
            font-size: 14px;
            color: #ccc;
        }
        .key-special:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #000, 0 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="phone">
        <!-- Side Panels (Red) -->
        <div class="side-panel left">
            <div class="side-btn" onclick="pressKey('Vol Up')">+</div>
            <div class="side-btn" onclick="pressKey('Vol Down')">-</div>
        </div>
        <div class="side-panel right">
            <!-- Right side could have a camera button or similar -->
            <div class="side-btn" onclick="pressKey('Camera')" style="font-size:10px;">📷</div>
        </div>

        <!-- Top Section -->
        <div class="top-section">
            <div class="brand">
                <span>NOKIA</span>
                <span>XpressMusic</span>
            </div>
            
            <div class="screen">
                <div class="screen-content">
                    <!-- Simulated Album Art / Wallpaper -->
                    <div style="font-weight: bold; color: #c00; font-size: 20px;">CUTE</div>
                    <div style="font-size: 10px; color: #666;">IS WHAT WE AIM FOR</div>
                    <div style="font-size: 12px; margin-top: 10px; color: #333;">Risque</div>
                    
                    <!-- LED Feedback (Green text) -->
                    <div id="led-feedback" class="led-feedback">Ready...</div>
                </div>
            </div>
        </div>

        <!-- Middle Section (Navigation & Call Buttons) -->
        <div class="middle-section">
            <div class="call-buttons">
                <button class="call-btn green" onclick="pressKey('Call / Green')"></button>
                <button class="call-btn red" onclick="pressKey('End / Red')"></button>
            </div>

            <div class="d-pad">
                <button class="d-pad-btn d-pad-up" onclick="pressKey('Up')">▲</button>
                <button class="d-pad-btn d-pad-down" onclick="pressKey('Down')">▼</button>
                <button class="d-pad-btn d-pad-left" onclick="pressKey('Left')">◀</button>
                <button class="d-pad-btn d-pad-right" onclick="pressKey('Right')">▶</button>
                <div class="d-pad-center" onclick="pressKey('Center / OK')"></div>
            </div>
        </div>

        <!-- Keypad -->
        <div class="keypad">
            <!-- Row 1 -->
            <div class="key" onclick="pressKey('1')">1 <span class="key-sub">∞</span></div>
            <div class="key" onclick="pressKey('2')">2 <span class="key-sub">ABC</span></div>
            <div class="key" onclick="pressKey('3')">3 <span class="key-sub">DEF</span></div>
            <!-- Row 2 -->
            <div class="key" onclick="pressKey('4')">4 <span class="key-sub">GHI</span></div>
            <div class="key" onclick="pressKey('5')">5 <span class="key-sub">JKL</span></div>
            <div class="key" onclick="pressKey('6')">6 <span class="key-sub">MNO</span></div>
            <!-- Row 3 -->
            <div class="key" onclick="pressKey('7')">7 <span class="key-sub">PQRS</span></div>
            <div class="key" onclick="pressKey('8')">8 <span class="key-sub">TUV</span></div>
            <div class="key" onclick="pressKey('9')">9 <span class="key-sub">WXYZ</span></div>
            <!-- Row 4 -->
            <div class="key key-special" onclick="pressKey('*')">* <span class="key-sub">+</span></div>
            <div class="key key-special" onclick="pressKey('0')">0 <span class="key-sub">Space</span></div>
            <div class="key key-special" onclick="pressKey('#')"># <span class="key-sub">Shift</span></div>
        </div>
    </div>

    <script>
        // ฟังก์ชันสำหรับการกดปุ่มและการแสดงผล LED
        function pressKey(keyName) {
            const feedbackEl = document.getElementById('led-feedback');
            
            // อัปเดตข้อความบนหน้าจอ LED
            feedbackEl.textContent = `กดปุ่ม: ${keyName}`;
            feedbackEl.classList.add('active');

            // ลบ Effect หลังจาก 1.5 วินาที
            clearTimeout(window.ledTimeout); // เคลียร์ Timeout เก่าถ้ามีการกดรัวๆ
            window.ledTimeout = setTimeout(() => {
                feedbackEl.classList.remove('active');
            }, 1500);

            // เพิ่ม Effect เสียง (ทางเลือก) - ถ้าต้องการให้มีเสียงคลิกสามารถเปิดใช้งานได้
            // const audio = new Audio('click.mp3'); // ต้องมีไฟล์เสียง
            // audio.play().catch(e => console.log("Audio play blocked"));
        }
    </script>
</body>
</html>
